<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" width="1600" height="820" role="img" aria-label="LedgerLens architecture">
<defs><radialGradient id="bg" cx="75%" cy="45%" r="80%"><stop offset="0" stop-color="#173D35"/><stop offset=".6" stop-color="#0F2A24"/></radialGradient><linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2F5F3" stop-opacity=".13"/><stop offset="1" stop-color="#F2F5F3" stop-opacity=".05"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C9A227"/></marker></defs>
<rect width="1600" height="820" rx="18" fill="url(#bg)"/>
<rect x="18" y="18" width="1564" height="784" rx="6" fill="none" stroke="#C9A227" stroke-opacity=".45" stroke-width="1.5"/>
<text x="70" y="92" font-family="'Bodoni Moda','Didot','Bodoni 72',Georgia,serif" font-size="44" font-weight="700" fill="#F2F5F3">One core. What we measure is what we demo.</text>
<text x="70" y="132" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#9FC1B7">Every channel and the evaluation harness call the same code path.</text>
<rect x="70" y="200" width="270" height="130" rx="16" fill="url(#gl)" stroke="#C9A227" stroke-opacity=".45" stroke-width="1.5"/>
<text x="92" y="242" font-family="'Bodoni Moda','Didot','Bodoni 72',Georgia,serif" font-size="26" font-weight="700" fill="#F2F5F3">Photo</text>
<text x="92" y="272" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9D2CA">receipt, notebook page,</text>
<text x="92" y="296" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9D2CA">money SMS</text>
<rect x="70" y="410" width="270" height="130" rx="16" fill="url(#gl)" stroke="#C9A227" stroke-opacity=".45" stroke-width="1.5"/>
<text x="92" y="452" font-family="'Bodoni Moda','Didot','Bodoni 72',Georgia,serif" font-size="26" font-weight="700" fill="#F2F5F3">Voice note</text>
<text x="92" y="482" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9D2CA">Nyanja, English, mixed</text>
<rect x="70" y="620" width="270" height="130" rx="16" fill="url(#gl)" stroke="#C9A227" stroke-opacity=".45" stroke-width="1.5"/>
<text x="92" y="662" font-family="'Bodoni Moda','Didot','Bodoni 72',Georgia,serif" font-size="26" font-weight="700" fill="#F2F5F3">Eval set</text>
<text x="92" y="692" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9D2CA">labelled records and</text>
<text x="92" y="716" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9D2CA">sealed hold-out</text>
<rect x="400" y="200" width="270" height="150" rx="16" fill="url(#gl)" stroke="#C9A227" stroke-opacity=".45" stroke-width="1.5"/>
<text x="422" y="242" font-family="'Bodoni Moda','Didot','Bodoni 72',Georgia,serif" font-size="26" font-weight="700" fill="#F2F5F3">WhatsApp</text>
<text x="422" y="272" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9D2CA">designed first; test</text>
<text x="422" y="296" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9D2CA">account could not send</text>
<rect x="422" y="312" width="92" height="24" rx="12" fill="none" stroke="#7FB5A8"/><text x="433" y="329" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#7FB5A8">PLANNED</text>
<rect x="400" y="410" width="270" height="130" rx="16" fill="url(#gl)" stroke="#C9A227" stroke-opacity=".45" stroke-width="1.5"/>
<text x="422" y="452" font-family="'Bodoni Moda','Didot','Bodoni 72',Georgia,serif" font-size="26" font-weight="700" fill="#F2F5F3">Web chat</text>
<text x="422" y="482" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9D2CA">the planned fallback</text>
<rect x="422" y="498" width="62" height="24" rx="12" fill="#C9A227"/><text x="433" y="515" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0F2A24">LIVE</text>
<rect x="400" y="620" width="270" height="130" rx="16" fill="url(#gl)" stroke="#C9A227" stroke-opacity=".45" stroke-width="1.5"/>
<text x="422" y="662" font-family="'Bodoni Moda','Didot','Bodoni 72',Georgia,serif" font-size="26" font-weight="700" fill="#F2F5F3">Eval harness</text>
<text x="422" y="692" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9D2CA">no channel, same call</text>
<rect x="740" y="330" width="300" height="230" rx="16" fill="url(#gl)" stroke="#C9A227" stroke-opacity="1" stroke-width="1.5"/>
<text x="762" y="372" font-family="'Bodoni Moda','Didot','Bodoni 72',Georgia,serif" font-size="26" font-weight="700" fill="#F2F5F3">Core.handle()</text>
<text x="762" y="402" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9D2CA">Code assigns the evidence</text>
<text x="762" y="426" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9D2CA">tier, checks the arithmetic,</text>
<text x="762" y="450" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9D2CA">applies limits.</text>
<text x="762" y="474" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#C9A227">Nothing is saved until</text>
<text x="762" y="498" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#C9A227">the trader confirms.</text>
<rect x="1110" y="200" width="420" height="120" rx="16" fill="url(#gl)" stroke="#7FB5A8" stroke-opacity=".8" stroke-width="1.5"/>
<text x="1132" y="242" font-family="'Bodoni Moda','Didot','Bodoni 72',Georgia,serif" font-size="26" font-weight="700" fill="#F2F5F3">Muse Spark 1.3</text>
<text x="1132" y="272" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9D2CA">reads images into a fixed JSON schema</text>
<rect x="1110" y="410" width="420" height="120" rx="16" fill="url(#gl)" stroke="#7FB5A8" stroke-opacity=".8" stroke-width="1.5"/>
<text x="1132" y="452" font-family="'Bodoni Moda','Didot','Bodoni 72',Georgia,serif" font-size="26" font-weight="700" fill="#F2F5F3">Muse Voice Transcribe</text>
<text x="1132" y="482" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9D2CA">audio in memory, never stored</text>
<rect x="1110" y="620" width="420" height="120" rx="16" fill="url(#gl)" stroke="#C9A227" stroke-opacity=".45" stroke-width="1.5"/>
<text x="1132" y="662" font-family="'Bodoni Moda','Didot','Bodoni 72',Georgia,serif" font-size="26" font-weight="700" fill="#F2F5F3">Ledger, then credit file</text>
<text x="1132" y="692" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9D2CA">HTML and PDF for the lender</text>

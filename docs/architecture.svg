<path d="M340 475H394" stroke="#C9A227" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M340 685H394" stroke="#C9A227" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M670 275L734 390" stroke="#C9A227" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M670 475H734" stroke="#C9A227" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M670 685L734 520" stroke="#C9A227" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M1040 380L1104 260" stroke="#C9A227" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M1040 445H1104" stroke="#C9A227" stroke-width="2.5" fill="none" marker-end="url(#ar)" transform="translate(0,25)"/>
<path d="M1040 520L1104 680" stroke="#C9A227" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
</svg>